<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-label="Illustrated baseball field">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#15395f"/>
      <stop offset="1" stop-color="#071d3a"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#3b9d5e"/>
      <stop offset=".58" stop-color="#217346"/>
      <stop offset="1" stop-color="#145234"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="dirt" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d9a05e"/>
      <stop offset="1" stop-color="#a56432"/>
    </linearGradient>
    <filter id="lift" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#031326" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="900" height="680" rx="34" fill="url(#sky)"/>
  <path d="M35 650 C52 290 210 78 450 46 C690 78 848 290 865 650 Z" fill="url(#grass)"/>
  <path d="M62 650 C82 316 228 118 450 84 C672 118 818 316 838 650 Z" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="22"/>

  <g opacity=".74">
    <path d="M105 650 C124 342 252 158 450 126 C648 158 776 342 795 650" fill="none" stroke="url(#stripe)" stroke-width="24"/>
    <path d="M174 650 C188 380 286 205 450 174 C614 205 712 380 726 650" fill="none" stroke="url(#stripe)" stroke-width="22"/>
    <path d="M248 650 C258 428 326 262 450 232 C574 262 642 428 652 650" fill="none" stroke="url(#stripe)" stroke-width="20"/>
  </g>

  <path d="M88 650 L450 104 L812 650" fill="none" stroke="#f7f7ee" stroke-width="8" stroke-linecap="round"/>
  <path d="M450 104 L812 650 L88 650 Z" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="3"/>

  <g filter="url(#lift)">
    <path d="M450 636 L236 422 L450 208 L664 422 Z" fill="url(#dirt)" stroke="#f8f6ed" stroke-width="9"/>
    <path d="M450 590 L282 422 L450 254 L618 422 Z" fill="#27734a" stroke="#f8f6ed" stroke-opacity=".58" stroke-width="5"/>
    <circle cx="450" cy="425" r="58" fill="url(#dirt)" stroke="#f8f6ed" stroke-width="7"/>
    <rect x="414" y="417" width="72" height="12" rx="6" fill="#f8f6ed"/>
  </g>

  <g fill="#fffdf6" stroke="#d7a43b" stroke-width="5" filter="url(#lift)">
    <rect x="641" y="399" width="46" height="46" rx="5" transform="rotate(45 664 422)"/>
    <rect x="427" y="185" width="46" height="46" rx="5" transform="rotate(45 450 208)"/>
    <rect x="213" y="399" width="46" height="46" rx="5" transform="rotate(45 236 422)"/>
    <path d="M412 618 H488 V650 L450 674 L412 650 Z"/>
  </g>

  <path d="M238 505 Q450 395 662 505" fill="none" stroke="#f7f7ee" stroke-width="5" stroke-dasharray="12 12" opacity=".7"/>
  <path d="M196 562 Q450 448 704 562" fill="none" stroke="#f7f7ee" stroke-width="4" stroke-dasharray="10 14" opacity=".46"/>
  <circle cx="450" cy="208" r="7" fill="#071d3a" opacity=".2"/>
  <circle cx="450" cy="636" r="7" fill="#071d3a" opacity=".2"/>
</svg>
