<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MLB Batting Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <nav class="site-nav">
      <a class="brand" href="index.html">MLB Batting Trends</a>
      <div class="nav-links">
        <a href="index.html">Report</a>
        <a aria-current="page" href="dashboard.html">Dashboard</a>
      </div>
    </nav>

    <main class="dashboard-shell">
      <aside class="filters-panel" aria-label="Dashboard filters">
        <div class="panel-heading">
          <h1>Dashboard</h1>
          <button id="resetFilters" class="secondary-button" type="button">Reset</button>
        </div>

        <label>
          Start year
          <input id="startYear" type="number" min="1901" max="2021" value="1901">
        </label>
        <label>
          End year
          <input id="endYear" type="number" min="1901" max="2021" value="2021">
        </label>
        <label>
          Team
          <select id="teamFilter"></select>
        </label>
        <label>
          League
          <select id="leagueFilter"></select>
        </label>
        <label>
          Bats
          <select id="batsFilter"></select>
        </label>
        <label>
          Birth country
          <select id="countryFilter"></select>
        </label>

        <label>
          Measure
          <select id="measureSelect">
            <option value="home_runs">Home runs</option>
            <option value="hits">Hits</option>
            <option value="rbi">RBI</option>
            <option value="plate_appearances">Plate appearances</option>
            <option value="walks">Walks</option>
            <option value="strikeouts">Strikeouts</option>
            <option value="ops">Average OPS</option>
          </select>
        </label>
        <label>
          Break down by
          <select id="breakdownSelect">
            <option value="team_name">Team</option>
            <option value="league">League</option>
            <option value="bats">Bats</option>
            <option value="birth_country">Birth country</option>
            <option value="year">Year</option>
          </select>
        </label>
      </aside>

      <section class="dashboard-main">
        <div id="loadingState" class="loading-state">Loading MLB batting data...</div>
        <div class="metric-grid" id="dashboardMetrics" aria-live="polite"></div>
        <div class="dashboard-grid">
          <div class="chart-panel"><canvas id="breakdownChart"></canvas></div>
          <div class="chart-panel"><canvas id="trendChart"></canvas></div>
          <div class="chart-panel"><canvas id="teamChart"></canvas></div>
          <div class="chart-panel"><canvas id="playerChart"></canvas></div>
        </div>
        <div class="table-panel">
          <div class="table-heading">
            <h2>Current View</h2>
            <span id="rowCount"></span>
          </div>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Player</th>
                  <th>Year</th>
                  <th>Team</th>
                  <th>League</th>
                  <th>PA</th>
                  <th>HR</th>
                  <th>OPS</th>
                </tr>
              </thead>
              <tbody id="dataTable"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/dashboard.js"></script>
  </body>
</html>
